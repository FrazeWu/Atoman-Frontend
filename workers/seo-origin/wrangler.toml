name = "atoman-seo-origin"
main = "index.js"
compatibility_date = "2026-11-24"
workers_dev = false

[[vpc_services]]
binding = "PRIVATE_ORIGIN"
service_id = "01a20b34-a449-7b81-bf50-c2b14b8b21ac"


# This private bucket is not connected to any public domain or r2.dev URL.
[[r2_buckets]]
binding = "SEO_CACHE"
bucket_name = "atoman-seo-private-cache"

[triggers]
crons = ["0 */2 * * *"]
