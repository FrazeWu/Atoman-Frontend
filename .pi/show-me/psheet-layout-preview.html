<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PSheet 布局预览</title>
    <style>
      :root {
        --ink: #0f172a;
        --muted: #64748b;
        --line: #cbd5e1;
        --soft: #e2e8f0;
        --paper: #ffffff;
        --wash: #f8fafc;
        --blue: #2563eb;
        --sidebar: 14%;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #eef2f7;
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: 96%;
        margin: 1.5rem auto;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        margin-bottom: 0.75rem;
      }

      .label {
        margin-right: 0.25rem;
        color: var(--muted);
        font-size: 0.875rem;
        font-weight: 600;
      }

      button {
        min-height: 2.5rem;
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--paper);
        color: var(--ink);
        font: inherit;
        cursor: pointer;
      }

      button.active,
      .publish {
        border-color: var(--blue);
        background: var(--blue);
        color: #ffffff;
      }

      .preview {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--paper);
        box-shadow: 0 14px 34px rgba(15, 23, 42, 0.1);
      }

      .topbar {
        display: flex;
        height: 3.5rem;
        align-items: center;
        gap: 1.5rem;
        padding: 0 1.25rem;
        border-bottom: 1px solid var(--soft);
        font-size: 0.875rem;
        font-weight: 600;
      }

      .topbar b {
        color: var(--blue);
      }

      .app {
        display: grid;
        grid-template-columns: var(--sidebar) minmax(0, 1fr);
        min-height: 36rem;
      }

      nav {
        padding: 1rem;
        border-right: 1px solid var(--soft);
        background: var(--wash);
        color: var(--muted);
        font-size: 0.875rem;
        line-height: 2.5;
      }

      .content {
        min-width: 0;
        padding: 1.5rem;
        background: var(--wash);
      }

      .frame {
        position: relative;
        container-type: inline-size;
        min-height: 33rem;
        border: 1px solid var(--soft);
        background: var(--paper);
      }

      .partial .frame {
        display: block;
      }

      .partial article {
        inline-size: 64cqw;
      }

      .partial aside {
        position: absolute;
        inset-block: 0;
        inset-inline-end: 0;
        inline-size: 32cqw;
      }

      article {
        min-width: 0;
        padding: 3rem clamp(1.5rem, 5vw, 5rem);
      }

      .meta {
        color: var(--muted);
        font-size: 0.8125rem;
        font-weight: 600;
      }

      h1 {
        max-inline-size: 90%;
        font-size: clamp(1.75rem, 3vw, 2.5rem);
        line-height: 1.18;
      }

      article p:not(.meta) {
        max-inline-size: 90%;
        font-family: Georgia, serif;
        font-size: 1.075rem;
        line-height: 1.9;
      }

      aside {
        display: flex;
        min-width: 0;
        flex-direction: column;
        border-left: 1px solid var(--line);
        background: var(--paper);
      }

      .sheet-head {
        display: flex;
        min-height: 3.5rem;
        align-items: center;
        justify-content: space-between;
        padding: 0 1.25rem;
        border-bottom: 1px solid var(--soft);
        font-size: 0.875rem;
        font-weight: 700;
      }

      .close {
        width: 2.5rem;
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 1.25rem;
      }

      .sheet-body {
        flex: 1;
        padding: 1.5rem;
      }

      h2 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
      }

      .sheet-body p,
      label {
        color: var(--muted);
        font-size: 0.875rem;
        line-height: 1.6;
      }

      label {
        display: block;
        margin: 1rem 0 0.375rem;
        font-weight: 600;
      }

      textarea {
        width: 100%;
        min-height: 8rem;
        padding: 0.75rem;
        border: 1px solid var(--line);
        border-radius: 4px;
        font: inherit;
        resize: vertical;
      }

      .full .frame {
        display: block;
      }
      .full article {
        display: none;
      }
      .full aside {
        min-height: 33rem;
        border-left: 0;
      }
      .full .sheet-body {
        width: min(100%, 68cqw);
        margin: 0 auto;
        padding-top: 3rem;
      }

      .narrow.partial .frame {
        display: block;
      }
      .narrow.partial article {
        display: none;
      }
      .narrow.partial aside {
        min-height: 33rem;
        border-left: 0;
      }
      .fallback-note {
        display: none;
      }
      .narrow .fallback-note {
        display: block;
        margin-top: 1.25rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--soft);
      }

      @media (max-width: 47.5rem) {
        main {
          width: 100%;
          margin: 0;
        }
        .preview {
          border: 0;
          border-radius: 0;
          box-shadow: none;
        }
        nav {
          display: none;
        }
        .app {
          grid-template-columns: 1fr;
        }
        .content {
          padding: 0;
        }
        .partial .frame {
          display: block;
          border: 0;
        }
        .partial article {
          display: none;
        }
        .partial aside {
          position: static;
          inline-size: 100cqw;
          min-height: calc(100vh - 3.5rem);
          border-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="controls">
        <span class="label">PSheet 布局预览</span>
        <button type="button" data-mode="full">内容区全宽</button>
        <button class="active" type="button" data-mode="partial">
          右侧停靠
        </button>
        <button class="active" type="button" data-viewport="wide">宽屏</button>
        <button type="button" data-viewport="narrow">窄屏回退</button>
      </div>

      <section class="preview partial">
        <header class="topbar">
          <b>订阅</b><span>博客</span><span>音乐</span><span>视频</span
          ><span>播客</span>
        </header>
        <div class="app">
          <nav>订阅源<br />稍后阅读<br />我的收藏<br />已读文章</nav>
          <div class="content">
            <div class="frame">
              <article>
                <p class="meta">RSS 正文 · 2026年8月31日 · 约 4,945 字</p>
                <h1>编辑部来了 AI 实习生：一篇值得细读的行业观察</h1>
                <p>
                  正文始终位于独立内容列。评论层只使用正文之外预留的右侧空间，打开后正文不移动也不缩窄。
                </p>
                <p>视频页面的媒体区域也保持原有尺寸，不会被评论层覆盖。</p>
              </article>
              <aside>
                <header class="sheet-head">
                  <span>评论</span
                  ><button class="close" type="button" aria-label="关闭评论">
                    ×
                  </button>
                </header>
                <div class="sheet-body">
                  <h2>发表评论</h2>
                  <p>评论作为上层，仅使用正文之外的预留空间。</p>
                  <label for="comment">内容</label>
                  <textarea id="comment" placeholder="写下你的想法"></textarea>
                  <button class="publish" type="button">发布评论</button>
                  <p class="fallback-note">
                    当前宽度不足，已自动回退为全宽模式。
                  </p>
                </div>
              </aside>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script>
      const preview = document.querySelector(".preview");
      const setActive = (selector, target) => {
        document.querySelectorAll(selector).forEach((button) => {
          button.classList.toggle("active", button === target);
        });
      };

      document.querySelectorAll("[data-mode]").forEach((button) => {
        button.addEventListener("click", () => {
          preview.classList.toggle("full", button.dataset.mode === "full");
          preview.classList.toggle(
            "partial",
            button.dataset.mode === "partial",
          );
          setActive("[data-mode]", button);
        });
      });

      document.querySelectorAll("[data-viewport]").forEach((button) => {
        button.addEventListener("click", () => {
          preview.classList.toggle(
            "narrow",
            button.dataset.viewport === "narrow",
          );
          setActive("[data-viewport]", button);
        });
      });
    </script>
  </body>
</html>
