name: Archive Frontend Release Assets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archive-frontend-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            node_modules/.cache/tsbuildinfo
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run archive:release-assets
        env:
          CLOUDFLARE_ACCOUNT_ID: 5052057d2c799fddc7d37001846b6e26
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_RELEASE_ASSETS_TOKEN }}
          FRONTEND_RELEASE_ASSET_BUCKET: atoman-frontend-releases
