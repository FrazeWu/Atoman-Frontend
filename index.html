    <style>
      html[data-portal-prerender] body { margin: 0; }
      .portal-prerender { display: none; }
      html[data-portal-prerender] .portal-prerender {
        display: block;
        min-height: 100vh;
        color: #171717;
        background: #fff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .portal-prerender__topbar {
        height: 56px;
        box-sizing: border-box;
        border-bottom: 1px solid #e8e8e8;
        background: rgba(255, 255, 255, 0.85);
      }
      .portal-prerender__hero {
        box-sizing: border-box;
        padding: 72px 24px 64px;
        border-bottom: 1px solid #e8e8e8;
        text-align: center;
        background: linear-gradient(180deg, #fafafa 0%, #fff 100%);
      }
      .portal-prerender__content {
        max-width: 800px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      .portal-prerender__badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border: 1px solid #e8e8e8;
        border-radius: 9999px;
        color: #737373;
        background: #fff;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.05em;
      }
      .portal-prerender__dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #171717;
      }
      .portal-prerender h1 {
        margin: 0;
        color: #171717;
        font-size: 44px;
        font-weight: 500;
        line-height: 1.15;
      }
      .portal-prerender__accent { color: #555; }
      .portal-prerender p {
        max-width: 580px;
        margin: 0;
        color: #666;
        font-size: 16px;
        line-height: 1.6;
      }
      .portal-prerender__actions {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-top: 8px;
      }
      .portal-prerender__actions a {
        box-sizing: border-box;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 36px;
        padding: 8px 18px;
        border: 1px solid #d4d4d4;
        border-radius: 4px;
        color: #171717;
        background: #fff;
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
      }
      .portal-prerender__actions a:first-child {
        border-color: #171717;
        color: #fff;
        background: #171717;
      }
      @media (max-width: 860px) {
        .portal-prerender__hero { padding: 48px 16px 40px; }
        .portal-prerender h1 { font-size: 32px; }
      }
      @media (max-width: 600px) {
        .portal-prerender h1 { font-size: 26px; }
        .portal-prerender p { font-size: 14px; }
      }
    </style>
