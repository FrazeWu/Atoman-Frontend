<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Atoman 歌词文字排版对比</title>
  <style>
    :root {
      --a-color-primary: #2563eb;
      --a-color-accent-confirm: #0d9488;
      --a-color-bg-light: #ffffff;
      --a-color-bg-dark: #0f172a;
      --a-color-border-light: #cbd5e1;
      --a-color-border-dark: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 40px 20px;
      background: #f1f5f9;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }

    h1 {
      font-size: 20px;
      font-weight: 500;
      margin-top: 0;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 15px;
    }

    .desc {
      font-size: 14px;
      color: #475569;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 25px;
    }

    .preview-card {
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s;
      background: #f8fafc;
    }

    .preview-card:hover {
      border-color: var(--a-color-primary);
    }

    .preview-card.active {
      border-color: var(--a-color-primary);
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
    }

    .preview-title {
      padding: 12px;
      font-size: 13px;
      font-weight: bold;
      background: #f1f5f9;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .preview-screen {
      position: relative;
      height: 240px;
      background: #fafafa;
      border-radius: 0 0 6px 6px;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    .mock-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px dashed rgba(0,0,0,0.1);
      padding-bottom: 8px;
    }

    .mock-lyrics-body {
      flex: 1;
      overflow: hidden;
      line-height: 2;
      font-size: 12px;
      opacity: 0.8;
    }

    .mock-line-active {
      font-weight: bold;
      color: var(--a-color-primary);
      font-size: 13px;
    }

    .badge-btn {
      font-size: 8px;
      padding: 2px 6px;
      background: #0f172a;
      color: white;
      border-radius: 4px;
      border: none;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Atoman 歌词文字排版方向对比</h1>
  <div class="desc">
    已确定采用“底部向上滑出大浮层 (Bottom Sheet)”。
    下面是歌词内容的文字排版形式对比，请刷新页面后进行选择：
  </div>

  <div class="preview-grid">
    
    <!-- Option 1: Centered Card -->
    <div class="preview-card" onclick="selectLayout(1, this)">
      <div class="preview-title">
        <span>方案 1：经典居中对齐 (Centered Alignment)</span>
        <button class="badge-btn">选择此项</button>
      </div>
      <div class="preview-screen" style="align-items: center; text-align: center;">
        <div class="mock-lyrics-body" style="width: 100%;">
          <div>穿过时间的边缘，寻找有你的光年</div>
          <div class="mock-line-active">纸片的刻痕记录下 每一个未完的心愿</div>
          <div style="opacity: 0.4;">随着指尖流动的音符，写下新的一天</div>
        </div>
      </div>
    </div>

    <!-- Option 2: Left aligned with mono-timestamp Card -->
    <div class="preview-card" onclick="selectLayout(2, this)">
      <div class="preview-title">
        <span>方案 2：精密左对齐 + 等宽时间线 (Left Aligned Timeline)</span>
        <button class="badge-btn">选择此项</button>
      </div>
      <div class="preview-screen" style="align-items: flex-start; text-align: left;">
        <div class="mock-lyrics-body" style="width: 100%; font-family: monospace;">
          <div style="display: flex; gap: 15px;"><span style="opacity: 0.4;">00:12</span><span>穿过时间的边缘，寻找有你的光年</span></div>
          <div class="mock-line-active" style="display: flex; gap: 15px;"><span>00:24</span><span>纸片的刻痕记录下 每一个未完的心愿</span></div>
          <div style="display: flex; gap: 15px; opacity: 0.4;"><span>00:36</span><span>随着指尖流动的音符，写下新的一天</span></div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  function selectLayout(option, el) {
    document.querySelectorAll('.preview-card').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
  }
</script>

</body>
</html>
