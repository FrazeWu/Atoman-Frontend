name: Archive Frontend Release Assets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archive-frontend-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run archive:release-assets
        env:
          CLOUDFLARE_ACCOUNT_ID: 5052057d2c799fddc7d37001846b6e26
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_RELEASE_ASSETS_TOKEN }}
          FRONTEND_RELEASE_ASSET_BUCKET: atoman-frontend-releases
